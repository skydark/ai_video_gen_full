# scene asset
id: 如月寮_玄关_白天
name: 如月寮玄关
type: scene
ref_image: 如月寮_玄关_白天.png

brief: |
  典型的日式传统木造建筑内部，包含铺有青石板的宽敞玄关大厅和阳光充足的深邃木质长廊，氛围宁静且充满生活气息。

detail: |
  场景分为两个主要区域。上方为宽敞的玄关大厅，地面铺设不规则的青灰色石板，左侧设有深棕色木制接待柜和金属伞架（插有长柄伞），正前方是巨大的木框玻璃推拉门，透入强烈的室外自然光，墙角放置着扫帚和簸箕，天花板可见木梁结构和荧光灯。下方为一条纵深的木质走廊，地板呈现温暖的棕黄色，右侧排列着明亮的方格窗户，阳光倾洒在地板上形成清晰的光影条纹；左侧是一排带有观察窗的木门，墙上挂有公告板，前景处放置着垃圾桶、清洁工具桶和绿色换鞋地垫（上有拖鞋）。整体色调以木质的暖褐色和石板的冷青色为主，光线明亮，具有典型的日式动画背景风格。

tags: [日式建筑, 玄关, 走廊, 学校, 道场, 阳光, 木地板, 石板地, 伞架, 动画风格, 室内场景, 清洁工具]
