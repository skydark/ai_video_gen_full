brief: |
  一位拥有浅绿色短发和侧马尾的年轻动漫少女，身穿带有白色毛绒边饰的粉色连帽外套，搭配黑色紧身裤和粉色短靴，表情丰富多变，整体气质活泼可爱。

detail: |
  一位年轻的动漫风格少女，拥有浅绿色（或淡黄绿色）的齐肩短发，左侧扎着一个用金色球形发饰固定的侧马尾，刘海自然垂落。她有着紫红色的瞳孔和白皙的皮肤。身穿一件粉红色的连帽派克大衣式外套，外套领口处有带黑色蕾丝边缘的白色披肩设计，袖口和下摆饰有厚实的白色毛绒边，胸前有黑色抽绳及白色绒球装饰。内搭一件浅蓝绿色的高领毛衣。下身穿着黑色的紧身裤（或连裤袜），外套下摆露出少许黑色褶边短裙。脚穿粉红色短靴，靴口同样有白色毛绒翻边。体型纤细娇小，站姿自然，展现出多种面部表情，包括微笑、生气、悲伤和开朗大笑。

