prompt: '【风格】统一日式动画/漫剧风格，保持参考图中的角色身份、服装、轮廓和场景结构。


  【时长】约 12.5 秒。


  【角色外观锚点】

  - 门仓甲：深棕色略凌乱短发，蓝色眼睛，白皙皮肤；黑色长款连帽风衣，浅棕色毛领，浅蓝色圆领T恤，深蓝色宽松长裤，黑色高帮战斗靴，黑色露指手套，瘦削匀称少年体态。

  - 须藤雅：深棕色短发向后梳理，深蓝色眼睛，白皙皮肤；米色长款风衣敞开，白色长袖衬衫，松开的深蓝色领带，深灰色西装长裤，棕色皮带，深棕色皮鞋，细银色项链，修长挺拔，表情从轻佻笑容到冷峻严肃。

  - 桐岛蕾：金色长直发，蓝紫色眼睛，黑色角状发饰和呆毛；深蓝色长袖衬衫与深蓝领带，浅灰色修身西装马甲，黑色包臀短裙，灰色过膝丝袜，黑色高跟鞋，黑色战术背带，干练冷艳。

  - 若草菜叶：浅绿色齐肩短发，左侧金色球形发饰侧马尾，紫红色眼睛；粉红色白毛绒边连帽派克外套，浅蓝绿色高领毛衣，黑色紧身裤，粉色短靴，纤细娇小，表情活泼。


  【时间码动作】

  [000.0-003.0] 屋外归来

  景别机位：门外远景到中景，甲与菜叶走向如月寮正门

  画面动作：夏日午后，甲在画面左侧、菜叶在画面右侧，从屋外沿正门方向回到如月寮。两人步速放松，菜叶先看向门口，甲跟随她的视线。角色外观：门仓甲：深棕色略凌乱短发，蓝色眼睛，白皙皮肤；黑色长款连帽风衣，浅棕色毛领，浅蓝色圆领T恤，深蓝色宽松长裤，黑色高帮战斗靴，黑色露指手套，瘦削匀称少年体态。若草菜叶：浅绿色齐肩短发，左侧金色球形发饰侧马尾，紫红色眼睛；粉红色白毛绒边连帽派克外套，浅蓝绿色高领毛衣，黑色紧身裤，粉色短靴，纤细娇小，表情活泼。

  镜头运动：轻微跟拍后稳定在正门前，为进入玄关建立方向。

  对白/声音：无对白，按动作和环境声处理

  光线场景：午后自然光，色调保持日式动画质感。场景锚点：如月寮门外：两层传统日式木造宿舍，深棕木板外墙、绿色瓦片屋顶、正门入口、花坛、自行车棚、木围栏、青山树林背景，夏日午后强阳光与清晰阴影。

  避免：不要身份漂移，不要服装互换，不要跳轴，不要左右关系突然交换，不要把镜头编号、字幕说明或制作文字画进画面。


  [003.0-006.0] 玄关发现来客鞋

  景别机位：玄关土间低机位插入到两人反应

  画面动作：玄关土间低机位，雅设定图中的深棕色皮鞋整齐放在石板地面，不特别夸张。镜头抬起到菜叶和甲，他们停步看向鞋子，意识到客厅里有客人。角色外观：门仓甲：深棕色略凌乱短发，蓝色眼睛，白皙皮肤；黑色长款连帽风衣，浅棕色毛领，浅蓝色圆领T恤，深蓝色宽松长裤，黑色高帮战斗靴，黑色露指手套，瘦削匀称少年体态。若草菜叶：浅绿色齐肩短发，左侧金色球形发饰侧马尾，紫红色眼睛；粉红色白毛绒边连帽派克外套，浅蓝绿色高领毛衣，黑色紧身裤，粉色短靴，纤细娇小，表情活泼。须藤雅：深棕色短发向后梳理，深蓝色眼睛，白皙皮肤；米色长款风衣敞开，白色长袖衬衫，松开的深蓝色领带，深灰色西装长裤，棕色皮带，深棕色皮鞋，细银色项链，修长挺拔，表情从轻佻笑容到冷峻严肃。

  镜头运动：低机位从鞋子轻推到两人膝上中景，视线方向指向客厅走廊。

  对白/声音：nanoha：“あれ、お客さんかな……” / kou：“みたいだな……”

  光线场景：午后自然光，色调保持日式动画质感。场景锚点：如月寮玄关：青灰石板土间、深棕木制接待柜、伞架、玻璃推拉门、木梁和荧光灯，连接一条暖棕木地板走廊，窗光形成条纹光影。

  避免：不要身份漂移，不要服装互换，不要跳轴，不要左右关系突然交换，不要把镜头编号、字幕说明或制作文字画进画面。


  [006.0-009.0] 听见客厅笑声

