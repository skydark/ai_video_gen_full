  画面动作：从客厅方向传来蕾轻笑声。甲与菜叶站在玄关，身体同时转向走廊深处；菜叶微微疑惑，甲警觉但不紧张。角色外观：门仓甲：深棕色略凌乱短发，蓝色眼睛，白皙皮肤；黑色长款连帽风衣，浅棕色毛领，浅蓝色圆领T恤，深蓝色宽松长裤，黑色高帮战斗靴，黑色露指手套，瘦削匀称少年体态。若草菜叶：浅绿色齐肩短发，左侧金色球形发饰侧马尾，紫红色眼睛；粉红色白毛绒边连帽派克外套，浅蓝绿色高领毛衣，黑色紧身裤，粉色短靴，纤细娇小，表情活泼。

  镜头运动：镜头顺着两人视线向走廊深处轻轻摇移，准备切入客厅。

