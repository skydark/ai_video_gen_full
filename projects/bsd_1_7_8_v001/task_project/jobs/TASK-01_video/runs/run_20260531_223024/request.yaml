  [009.0-012.5] 客厅揭示雅与蕾

  景别机位：客厅中景，雅坐在矮桌对面与蕾谈笑

  画面动作：切入客厅中景。雅坐在矮桌一侧，带轻佻笑容向蕾搭话；蕾坐在对面，掩嘴轻笑但保持冷静。矮桌、榻榻米、红坐垫清楚可见。角色外观：须藤雅：深棕色短发向后梳理，深蓝色眼睛，白皙皮肤；米色长款风衣敞开，白色长袖衬衫，松开的深蓝色领带，深灰色西装长裤，棕色皮带，深棕色皮鞋，细银色项链，修长挺拔，表情从轻佻笑容到冷峻严肃。桐岛蕾：金色长直发，蓝紫色眼睛，黑色角状发饰和呆毛；深蓝色长袖衬衫与深蓝领带，浅灰色修身西装马甲，黑色包臀短裙，灰色过膝丝袜，黑色高跟鞋，黑色战术背带，干练冷艳。

  镜头运动：镜头稳定，稍微推近雅和蕾的轻松谈笑关系。

  对白/声音：miyabi：“それで君、確か、俺と学園時代に会ったことがあったよね？” / rei：“くすくす……もう、冗談ばかり”

  光线场景：午后自然光，色调保持日式动画质感。场景锚点：如月寮客厅：日式和室，黄绿色榻榻米、深棕矮桌、红色坐垫、右侧木格窗和白窗帘、左侧蓝条纹襖、老式电视、日历和红灯笼，午后自然光温暖怀旧。

