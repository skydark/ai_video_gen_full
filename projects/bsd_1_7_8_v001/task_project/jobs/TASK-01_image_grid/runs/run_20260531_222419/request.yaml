prompt: '# 多宫格分镜图生成说明

  生成一张16:9的6格黑白或低饱和动画分镜草稿，用于检查构图、空间连续、角色左右关系、动作起止和表情变化。使用提供的角色与场景参考图锁定身份、服装、配色和环境。不要生成精修海报，不要把制作说明或长文字画进画面。


  角色外观锚点：

  - 门仓甲：深棕色略凌乱短发，蓝色眼睛，白皙皮肤；黑色长款连帽风衣，浅棕色毛领，浅蓝色圆领T恤，深蓝色宽松长裤，黑色高帮战斗靴，黑色露指手套，瘦削匀称少年体态。

  - 须藤雅：深棕色短发向后梳理，深蓝色眼睛，白皙皮肤；米色长款风衣敞开，白色长袖衬衫，松开的深蓝色领带，深灰色西装长裤，棕色皮带，深棕色皮鞋，细银色项链，修长挺拔，表情从轻佻笑容到冷峻严肃。

  - 桐岛蕾：金色长直发，蓝紫色眼睛，黑色角状发饰和呆毛；深蓝色长袖衬衫与深蓝领带，浅灰色修身西装马甲，黑色包臀短裙，灰色过膝丝袜，黑色高跟鞋，黑色战术背带，干练冷艳。

  - 若草菜叶：浅绿色齐肩短发，左侧金色球形发饰侧马尾，紫红色眼睛；粉红色白毛绒边连帽派克外套，浅蓝绿色高领毛衣，黑色紧身裤，粉色短靴，纤细娇小，表情活泼。


  分格内容：

  1. 屋外归来：门外远景到中景，甲与菜叶走向如月寮正门。夏日午后，甲在画面左侧、菜叶在画面右侧，从屋外沿正门方向回到如月寮。两人步速放松，菜叶先看向门口，甲跟随她的视线。角色外观：门仓甲：深棕色略凌乱短发，蓝色眼睛，白皙皮肤；黑色长款连帽风衣，浅棕色毛领，浅蓝色圆领T恤，深蓝色宽松长裤，黑色高帮战斗靴，黑色露指手套，瘦削匀称少年体态。若草菜叶：浅绿色齐肩短发，左侧金色球形发饰侧马尾，紫红色眼睛；粉红色白毛绒边连帽派克外套，浅蓝绿色高领毛衣，黑色紧身裤，粉色短靴，纤细娇小，表情活泼。
  镜头运动：轻微跟拍后稳定在正门前，为进入玄关建立方向。

  2. 玄关发现来客鞋：玄关土间低机位插入到两人反应。玄关土间低机位，雅设定图中的深棕色皮鞋整齐放在石板地面，不特别夸张。镜头抬起到菜叶和甲，他们停步看向鞋子，意识到客厅里有客人。角色外观：门仓甲：深棕色略凌乱短发，蓝色眼睛，白皙皮肤；黑色长款连帽风衣，浅棕色毛领，浅蓝色圆领T恤，深蓝色宽松长裤，黑色高帮战斗靴，黑色露指手套，瘦削匀称少年体态。若草菜叶：浅绿色齐肩短发，左侧金色球形发饰侧马尾，紫红色眼睛；粉红色白毛绒边连帽派克外套，浅蓝绿色高领毛衣，黑色紧身裤，粉色短靴，纤细娇小，表情活泼。须藤雅：深棕色短发向后梳理，深蓝色眼睛，白皙皮肤；米色长款风衣敞开，白色长袖衬衫，松开的深蓝色领带，深灰色西装长裤，棕色皮带，深棕色皮鞋，细银色项链，修长挺拔，表情从轻佻笑容到冷峻严肃。
  镜头运动：低机位从鞋子轻推到两人膝上中景，视线方向指向客厅走廊。

  3. 听见客厅笑声：玄关中景，甲与菜叶同时望向客厅方向。从客厅方向传来蕾轻笑声。甲与菜叶站在玄关，身体同时转向走廊深处；菜叶微微疑惑，甲警觉但不紧张。角色外观：门仓甲：深棕色略凌乱短发，蓝色眼睛，白皙皮肤；黑色长款连帽风衣，浅棕色毛领，浅蓝色圆领T恤，深蓝色宽松长裤，黑色高帮战斗靴，黑色露指手套，瘦削匀称少年体态。若草菜叶：浅绿色齐肩短发，左侧金色球形发饰侧马尾，紫红色眼睛；粉红色白毛绒边连帽派克外套，浅蓝绿色高领毛衣，黑色紧身裤，粉色短靴，纤细娇小，表情活泼。
  镜头运动：镜头顺着两人视线向走廊深处轻轻摇移，准备切入客厅。

  4. 客厅揭示雅与蕾：客厅中景，雅坐在矮桌对面与蕾谈笑。切入客厅中景。雅坐在矮桌一侧，带轻佻笑容向蕾搭话；蕾坐在对面，掩嘴轻笑但保持冷静。矮桌、榻榻米、红坐垫清楚可见。角色外观：须藤雅：深棕色短发向后梳理，深蓝色眼睛，白皙皮肤；米色长款风衣敞开，白色长袖衬衫，松开的深蓝色领带，深灰色西装长裤，棕色皮带，深棕色皮鞋，细银色项链，修长挺拔，表情从轻佻笑容到冷峻严肃。桐岛蕾：金色长直发，蓝紫色眼睛，黑色角状发饰和呆毛；深蓝色长袖衬衫与深蓝领带，浅灰色修身西装马甲，黑色包臀短裙，灰色过膝丝袜，黑色高跟鞋，黑色战术背带，干练冷艳。
  镜头运动：镜头稳定，稍微推近雅和蕾的轻松谈笑关系。

  5. 客厅揭示雅与蕾尾帧延展：保持上一格人物左右关系和视线方向，表现动作结束状态与下一段衔接。

  6. 客厅揭示雅与蕾尾帧延展：保持上一格人物左右关系和视线方向，表现动作结束状态与下一段衔接。


  全局避免：不要身份漂移、不要服装互换、不要跳轴、不要把镜头编号以外的说明文字画进画面。'
