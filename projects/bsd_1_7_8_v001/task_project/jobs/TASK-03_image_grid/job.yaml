  1. 雅差点说漏：雅近景，笑容中突然要说出关键话。雅俯身看着倒地的甲，笑着顺口要继续说什么；他说到一半，嘴刚张开，表情还没意识到危险。角色外观：须藤雅：深棕色短发向后梳理，深蓝色眼睛，白皙皮肤；米色长款风衣敞开，白色长袖衬衫，松开的深蓝色领带，深灰色西装长裤，棕色皮带，深棕色皮鞋，细银色项链，修长挺拔，表情从轻佻笑容到冷峻严肃。门仓甲：深棕色略凌乱短发，蓝色眼睛，白皙皮肤；黑色长款连帽风衣，浅棕色毛领，浅蓝色圆领T恤，深蓝色宽松长裤，黑色高帮战斗靴，黑色露指手套，瘦削匀称少年体态。
  镜头运动：近景轻微推近雅的嘴和表情，为被打断做节奏停顿。

  2. 蕾与菜叶包抄拖走：客厅中景，蕾与菜叶从两侧架住雅。蕾从画面左侧、菜叶从画面右侧突然包抄，各架住雅一条胳膊，把他往襖方向拖走。雅被夹在中间困惑挣扎但不真正反抗；甲仍在榻榻米上抬头看。角色外观：桐岛蕾：金色长直发，蓝紫色眼睛，黑色角状发饰和呆毛；深蓝色长袖衬衫与深蓝领带，浅灰色修身西装马甲，黑色包臀短裙，灰色过膝丝袜，黑色高跟鞋，黑色战术背带，干练冷艳。若草菜叶：浅绿色齐肩短发，左侧金色球形发饰侧马尾，紫红色眼睛；粉红色白毛绒边连帽派克外套，浅蓝绿色高领毛衣，黑色紧身裤，粉色短靴，纤细娇小，表情活泼。须藤雅：深棕色短发向后梳理，深蓝色眼睛，白皙皮肤；米色长款风衣敞开，白色长袖衬衫，松开的深蓝色领带，深灰色西装长裤，棕色皮带，深棕色皮鞋，细银色项链，修长挺拔，表情从轻佻笑容到冷峻严肃。门仓甲：深棕色略凌乱短发，蓝色眼睛，白皙皮肤；黑色长款连帽风衣，浅棕色毛领，浅蓝色圆领T恤，深蓝色宽松长裤，黑色高帮战斗靴，黑色露指手套，瘦削匀称少年体态。
  镜头运动：中景横向拉动，镜头跟随三人从矮桌旁移向襖。

  3. 襖啪地关上：襖正面插入，甲留在房间内。蓝条纹襖被啪地关上，蕾、菜叶和雅消失在门后。甲独自留在榻榻米房间里，坐起身看着紧闭的襖。角色外观：门仓甲：深棕色略凌乱短发，蓝色眼睛，白皙皮肤；黑色长款连帽风衣，浅棕色毛领，浅蓝色圆领T恤，深蓝色宽松长裤，黑色高帮战斗靴，黑色露指手套，瘦削匀称少年体态。
  镜头运动：快速切到襖关闭插入，再停半秒给甲反应。

  4. 雅单独回来：客厅中景，甲站起，襖再次拉开雅出来。甲从榻榻米上站起，整理衣服。片刻后襖再次拉开，雅独自走出来，挠头赔笑，试图把刚才的打断轻描淡写带过。蕾和菜叶不再同屏。角色外观：门仓甲：深棕色略凌乱短发，蓝色眼睛，白皙皮肤；黑色长款连帽风衣，浅棕色毛领，浅蓝色圆领T恤，深蓝色宽松长裤，黑色高帮战斗靴，黑色露指手套，瘦削匀称少年体态。须藤雅：深棕色短发向后梳理，深蓝色眼睛，白皙皮肤；米色长款风衣敞开，白色长袖衬衫，松开的深蓝色领带，深灰色西装长裤，棕色皮带，深棕色皮鞋，细银色项链，修长挺拔，表情从轻佻笑容到冷峻严肃。
