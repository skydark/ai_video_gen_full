# scene asset: 夏日河堤台阶 / 河川敷运动场旁
id: 校园_校园道_白天
name: 校园校园道
type: scene
ref_image: 校园_校园道_白天.png

brief: |
  这是一个典型的日式动画风格夏日户外场景，展示了连接河堤道路与下方沙地运动场的混凝土长阶梯。画面包含茂盛的绿植、远处的河流与桥梁，光线明亮，氛围清新宁静。

detail: |
  这是一个阳光明媚的夏日室外场景，位于河川敷（河堤）区域。画面主体是一条沿着陡峭护岸向上延伸的混凝土长楼梯，连接着下方的土路和上方的柏油马路，楼梯两侧设有白色的金属栏杆。护岸斜坡上覆盖着茂密鲜绿的杂草和灌木。画面左侧是一个被铁丝网围起来的沙地运动场，地面呈现干燥的土黄色，远处可见长椅和候车亭。背景远处有一条宽阔的河流，河面上横跨着一座蓝色的桁架桥，对岸可见连绵的青山和几栋灰白色的多层建筑（类似学校教学楼或公寓）。天空呈现清澈的蔚蓝色，漂浮着巨大的白色积云（入道云）。光线强烈且直射，投射出清晰的阴影，整体色调以高饱和度的天蓝色和翠绿色为主，辅以混凝土的灰白和土地的暖黄，具有典型的清新动漫美术风格。

