  1. 菜ノ叶擦去眼角（首帧）：菜ノ叶近景慢推。菜ノ叶用手背轻轻擦过眼角，深吸一口气，抬脸专注看向画面左侧的甲。她的表情从难过转为认真。 角色外观严格参考对应角色参考图。场景严格参考校园_校园道_白天。
