  5. 菜ノ叶不能回答（首帧）：菜ノ叶近景到双人中景。菜ノ叶垂下眼帘，难受地轻轻摇头。切到双人中景，甲在画面左侧，菜ノ叶在右侧。甲放缓语气安抚，菜ノ叶仍低头回应。
  角色外观严格参考对应角色参考图。场景严格参考校园_校园道_白天。 镜头运动：从菜ノ叶近景切到双人中景，镜头稳定。 表现动作开始状态、角色初始位置和画框构图。

  6. 菜ノ叶不能回答（尾帧）：菜ノ叶近景到双人中景。菜ノ叶垂下眼帘，难受地轻轻摇头。切到双人中景，甲在画面左侧，菜ノ叶在右侧。甲放缓语气安抚，菜ノ叶仍低头回应。
  角色外观严格参考对应角色参考图。场景严格参考校园_校园道_白天。 镜头运动：从菜ノ叶近景切到双人中景，镜头稳定。 表现动作结束状态、视线/站位结果和下一镜衔接。


  ## Avoid


  - 不要交换角色身份、颜色或左右位置。

  - 不要跳轴，不要反转视线方向。

  - 不要让爆炸、烟尘、背景细节遮住主体。

