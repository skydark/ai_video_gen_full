  4. 甲沉默后追问（尾帧）：甲近景。甲看着菜ノ叶的侧脸，然后低头沉默；风轻轻吹动棕色刘海和风衣毛领。再抬头时神情转为严肃，视线朝画面右侧的菜ノ叶。 角色外观严格参考对应角色参考图。场景严格参考校园_校园道_白天。
