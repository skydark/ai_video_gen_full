  1. 菜ノ叶柔和思念（首帧）：菜ノ叶近景慢推。菜ノ叶近景。她惊讶过后目光逐渐柔和，手仍搭在护栏上，望向远处空操场和天空，脸上是怀念的微笑，不出现任何回忆画面。
  角色外观严格参考对应角色参考图。场景严格参考校园_校园道_白天。 镜头运动：缓慢推近菜ノ叶侧脸。 表现动作开始状态、角色初始位置和画框构图。

  2. 菜ノ叶柔和思念（尾帧）：菜ノ叶近景慢推。菜ノ叶近景。她惊讶过后目光逐渐柔和，手仍搭在护栏上，望向远处空操场和天空，脸上是怀念的微笑，不出现任何回忆画面。
  角色外观严格参考对应角色参考图。场景严格参考校园_校园道_白天。 镜头运动：缓慢推近菜ノ叶侧脸。 表现动作结束状态、视线/站位结果和下一镜衔接。

  3. 甲沉默后追问（首帧）：甲近景。甲看着菜ノ叶的侧脸，然后低头沉默；风轻轻吹动棕色刘海和风衣毛领。再抬头时神情转为严肃，视线朝画面右侧的菜ノ叶。 角色外观严格参考对应角色参考图。场景严格参考校园_校园道_白天。
