prompt: '【风格】按项目统一动画/漫剧风格；保持参考图一致性。


  【时长】约 13.0 秒。


  【参考图锚点】

  - @门仓甲设定图：一名年轻男性角色，拥有深棕色略凌乱短发、蓝色眼睛和白皙皮肤。身穿黑色长款连帽风衣，帽子边缘有浅棕色毛领，内搭浅蓝色圆领T恤，下身深蓝色宽松长裤，黑色高帮战斗靴，黑色露指手套，体型瘦削匀称。。

  - @若草菜ノ叶设定图：一位年轻动漫少女，浅绿色齐肩短发，左侧用金色球形发饰扎侧马尾，紫红色瞳孔，白皙皮肤。身穿粉红色连帽派克外套，白色毛绒边饰，内搭浅蓝绿色高领毛衣，下身黑色紧身裤和粉色短靴，体型纤细娇小。。

  - @场景参考图：场景、光线、天气、空间结构。

  - @构图参考图：黑白或低饱和线框分镜图，只作为构图、机位、blocking、运动方向参考，不作为画风参考。


  【全局要求】

  - 使用上方 @参考图 锁定角色身份、配色、轮廓和场景。

  - 使用 approved storyboard/关键帧锁定构图、camera side、screen direction 和运动方向。

  - 对话镜头保持同一 180 度轴线，不交换左右关系。

  - 背景烟尘、爆炸和碎片只做辅助运动，不遮挡主体。


  【时间码动作】

  [00:00-00:05] 远景到中景缓推

  画面与动作：午后阳光下的校园道旁，白色护栏、混凝土台阶、绿草坡和远处空旷沙地运动场清楚可见。甲在画面左侧、菜ノ叶在右侧，两人并肩慢慢走来。远处运动场没有任何人。
  角色外观严格参考对应角色参考图。场景严格参考校园_校园道_白天。

  镜头运动：远景缓慢推到中景，保持两人和空操场同框。

  对白/声音：无对白，按动作和环境声处理

  避免：不要出现第三名角色、千夏、蕾、空、真、回忆闪回、未来都市或虚拟都市元素；不要身份漂移，不要跳轴，不要服装互换。


  [00:05-00:09] 中景侧面

  画面与动作：两人停在护栏边。菜ノ叶右手轻扶白色金属护栏，身体微微前倾眺望远处空无一人的沙地运动场。甲站在她左后方，跟着她的视线看向运动场。 角色外观严格参考对应角色参考图。场景严格参考校园_校园道_白天。

  镜头运动：镜头基本静止，轻微慢推到菜ノ叶侧脸。

  对白/声音：0.3-1.4s nanoha："誰も居ないグラウンドって、寂しいよね……"（画面内角色对口型）

  避免：不要出现第三名角色、千夏、蕾、空、真、回忆闪回、未来都市或虚拟都市元素；不要身份漂移，不要跳轴，不要服装互换。


  [00:09-00:13] 甲近景到菜ノ叶近景

  画面与动作：甲近景，他仍望着空操场，没有闪回，只是像想起什么一样转头看向画面右侧的菜ノ叶。切到菜ノ叶近景，她惊讶转头看甲。切回甲平静补充。背景始终是校园道护栏和虚化空操场。
  角色外观严格参考对应角色参考图。场景严格参考校园_校园道_白天。

  镜头运动：正反打剪辑，甲视线向右，菜ノ叶视线向左。

  对白/声音：0.3-1.3s kou："そういえば、この前、千夏に会ったよ"（画面内角色对口型） / 1.6-2.5s nanoha："えっ、千夏先輩に……？"（画面内角色对口型）
  / 2.8-3.8s kou："ああ、清城市の通りでばったり、ね"（画面内角色对口型）

  避免：不要出现第三名角色、千夏、蕾、空、真、回忆闪回、未来都市或虚拟都市元素；不要身份漂移，不要跳轴，不要服装互换。


  【避免】

  - 不要身份漂移，不要改变角色配色、服装、武器或轮廓。

  - 不要跳轴，不要互换左右位置，不要反转视线方向。

  - 不要把镜头编号、分镜编号或文字标签画进画面。

  - 不要让爆炸、烟尘或背景特效抢走主体。

