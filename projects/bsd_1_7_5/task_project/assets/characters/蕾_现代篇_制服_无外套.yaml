brief: |
  金发长直发的年轻女性，蓝色瞳孔，身穿灰色马甲搭配深蓝衬衫的OL风格制服，黑色短裙与灰色过膝袜，肩背战术背带，气质干练冷艳。

detail: |
  一位身材高挑、曲线丰满的年轻女性角色。金色长直发，刘海自然垂落，头顶两侧佩戴黑色角状发饰，脑后留有呆毛。
  蓝紫色眼睛，眼神锐利冷静，肤色白皙。上身穿深蓝色长袖衬衫，领口系深蓝色领带，外搭浅灰色修身西装马甲，马甲紧贴身体凸显胸部曲线。
  下身黑色紧身包臀短裙。腿部穿灰色半透明过膝长筒丝袜，大腿处有黑色袜圈细节，脚踩黑色尖头高跟鞋。
  肩膀可见黑色皮质背带（战术装备）。整体站姿挺拔，一手叉腰，展现职业特工干练气质。

