detail: |
  一名年轻男性角色，拥有深棕色的短发，发型略显凌乱，刘海自然垂在额前。他有着蓝色的眼睛和白皙的皮肤，面部轮廓清秀。身穿一件黑色的长款连帽风衣（派克大衣），帽子边缘装饰有厚实的浅棕色毛领，风衣边缘有白色滚边线条，内衬为浅米色。内搭一件浅蓝色的圆领T恤。下身穿着深蓝色的宽松长裤，裤脚卷起露出白色边缘，搭配深蓝色的长袜或护腿。脚踩黑色系带高帮战斗靴。腰间系着棕色皮带，手上戴着黑色的露指手套。体型瘦削匀称，呈现出少年的体态。

