detail: |
  浅绿色短发，左侧扎着带有金色球形发饰的侧马尾，刘海细碎自然垂落。紫色瞳孔，肤色白皙，表情丰富多变。
  内搭浅青色高领长袖，外穿蓝紫色修身马甲，马甲前襟有金色纽扣，下摆有浅蓝色条纹装饰。
  下身黑色百褶短裙，搭配黑色连裤袜和黑色平底鞋。体型苗条纤细，站姿自然活泼。

