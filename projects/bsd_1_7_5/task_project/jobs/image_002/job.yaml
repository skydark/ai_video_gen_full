prompt: 'Goal: Generate a 6-panel grayscale storyboard contact sheet for this video
  segment. Keep panel order left-to-right, top-to-bottom.


  Segment: TASK-01 清晨唤醒与新闻播报


  S001: 旅馆房间清晨. 中景，房间全貌，右侧窗透晨光. 中景定场。爱情旅馆房间清晨，阳光从右侧窗户射入形成光束，照亮床铺和地毯。双人床上被褥凌乱，暗示有人睡过。紫色沙发、老式CRT电视机、木质衣柜可见。安静温暖的晨间氛围。
  / 镜头静止

  S002: 蕾叫醒甲. 近景，蕾为主体的过肩镜头，甲在画面中景床边. 近景/过肩。蕾站在床侧，背对晨光（画面左侧或中央偏左），金发长直发被逆光勾勒出轮廓光。她微倾身，表情温和克制，看向坐在床边的甲。甲在画面右侧中景，坐在床边揉眼，头发凌乱，刚睡醒。前景可含蕾的肩部或手臂。
  / 镜头基本静止，仅保留轻微呼吸感手持微动

  S003: 甲醒来反应. 近景，甲正面，略俯角. 近景/特写。甲坐在床边，头发凌乱，抬头看向蕾的方向（画面右侧或上方）。他打了个哈欠，眼神还带着睡意，表情从迷茫到逐渐清醒。蓝色眼睛，棕色凌乱短发。穿浅蓝色T恤（无外套），背景是旅馆房间模糊的晨光环境。
  / 镜头轻微推近（缓慢push in），强调甲逐渐清醒的过程

  S004: 数据面板弹出. 插入镜头，半透明数据面板悬浮. 插入镜头。甲或蕾的视点：半透明蓝色数据面板在画面中央弹出，显示新闻推送通知。面板上有日文字符和图标。背景虚化为旅馆房间晨光氛围。伴随轻微的提示音视觉效果（闪光/脉冲）。
  / 镜头静止，面板从透明渐显

  S005: 蕾提醒甲看新闻. 中景，双人镜头，蕾和甲同框. 中景双人镜头。蕾在画面左侧，微敛神情，侧头看向数据面板来源方向，表情略带严肃。甲在画面右侧，捏了捏鼻梁，然后点头。两人保持稳定的左右位置关系，背景是旅馆房间。蕾站姿挺拔，甲坐在床边。
  / 镜头基本静止，轻微手持呼吸感

  S006: 清城市街景新闻蒙太奇. 远景，清城市清晨街道，CDF装甲车巡逻. 远景蒙太奇。清城市清晨街道，阳光从建筑间洒落。CDF装甲车在街道上缓慢巡逻。画面从旅馆房间叠画过渡而来。三条新闻画外音叠在街景上方。街景可以有少量行人、建筑立面、天空。色调偏冷（清城市晨间），与旅馆暖色调形成对比。最后画面淡出。
  / 镜头缓慢横移（slow pan），从街道一侧移到另一侧，或从高处缓慢下降


  Avoid: captions, subtitles, swapped character positions, inconsistent camera side.'
