prompt: '# Seedance Prompt - TASK-02 战斗刀+蕾入场+双人对话


  【风格】动画/漫剧风格，保持参考图一致性。


  【时长】约 11.5 秒。


  【参考图锚点】

  - @甲_现代篇_制服_有外套.png：棕色短发、蓝色眼睛、黑色长款连帽风衣毛领。

  - @蕾_现代篇_制服_无外套.png：金发长直发、蓝色瞳孔、灰色马甲+深蓝衬衫、黑色短裙、灰色过膝袜、战术背带、角状发饰。

  - @如月寮_后院_白天.png：后院场景。


  【全局要求】

  - 双人镜确立的正反打轴线（甲在画面左侧、蕾在画面右侧，甲视线向右、蕾视线向左）必须严格保持。

  - 蕾走出厨房时手持刀（尖朝下），进入双人对话前收起刀（插入腰间战术背带），之后不再出现刀。


  【时间码动作】


  [00:00-00:02] 插入特写 / 战斗刀砧板

  俯角特写。黑色战斗刀垂直剁入木质砧板，砧板碎裂成条状、木屑飞散。肉末在旁。画外传来菜ノ叶的尖叫：「わわわわっ……！？まな板まで千切りにしてどうするんですか〜〜っ！」。剁板声骤停。

  镜头运动：静止。

  避免：不显示手或厨房环境。


  [00:02-00:07] 中景POV / 蕾入场

  从甲POV看如月寮后门。蕾推门走出，垂双肩，右手攥刀（尖朝下），一脸沮丧，沿小径走向甲。从建筑阴影走入阳光，金发被照亮。甲在POV前景。她说着：「はい、台所を追い出されてしまいました」，语气无奈。

  镜头运动：基本静止POV，蕾走近时微弱呼吸感。

  避免：POV方向必须朝向厨房入口（承接前一个镜头横摇方向）。不显示厨房内部。


  [00:07-00:11.5] 双人中景 / 料理对话

  双人中景，甲在画面左侧，蕾在画面右侧。甲右手撑膝站起，拍草屑，轻松笑问：「それよりレインって、ひょっとして料理が苦手だったりするのか？」。蕾已将刀收起，垂肩，自嘲苦笑回答：「はい……今となっては、花嫁修業を拒絶していたのが悔やまれます」。甲视线向右看蕾、蕾视线向左看甲——确立全段轴线。观众注意点应在两人表情和对话上，不应再看到刀。

  镜头运动：基本静止，轻微呼吸感。

  避免：不交换左右位置。蕾服装发色一致。刀已收起不可见。


  【Negative / 避免】

  - 不要身份漂移

  - 不要跳轴或交换左右

  - 蕾进入双人对话前收起刀，之后不可见

  - 蕾出场POV方向承接前一个镜头

  '
