prompt: '# Seedance Prompt - TASK-04 闹别扭特写+收尾


  【风格】动画/漫剧风格，保持参考图一致性。


  【时长】约 14.5 秒。


  【参考图锚点】

  - @甲_现代篇_制服_有外套.png：棕色短发、蓝色眼睛、黑色长款连帽风衣毛领。

  - @蕾_现代篇_制服_无外套.png：金发长直发、蓝色瞳孔、英姿飒爽

  - @如月寮_后院_白天.png：花园午后场景。


  【全局要求】

  - 保持蕾的高雅，禁止添加红晕

  - 午后柔光持续，微风贯穿全段。


  【时间码动作】


  [00:00-00:06] 蕾近景 / 黯淡微笑

  蕾对甲的安慰先微微笑了——短暂复杂，非开心。随后笑容消失，视线从甲方向（左）→飘向画面右侧厨房方向（菜ノ叶所在处），低声说：「そうでしょうけど……それでも、菜ノ葉さんを見ていると、身につまされるものを感じてしまいます」。表情黯淡，眼神有羡慕和自我对比。金发微风轻动。

  镜头运动：基本静止。

  避免：微笑→黯淡转折要自然但可见。视线左→右转换清晰。


  [00:06-00:10] 蕾特写 / 闹别扭 ★关键

  特写蕾侧脸（偏右侧，面朝左）。闹别扭神情（すねた顔）：嘴角微撇一侧、视线偏下/侧方、眉头微蹙。她语带微不满说：「なんです？中尉」。甲在画外左侧轻声笑答：「いや、なんでもないよ」。微风拂金发。阳光柔和高光。黑色角状发饰可见。

  镜头运动：静止，让演技成为唯一焦点。

  避免：绝对不能画成生气或悲伤！核心是すねた表情。


  [00:10-00:12] 甲近景 / 轻笑

  近景甲。凝视右侧蕾(画外)，听到闹别扭语气后轻轻笑——温暖、短暂，觉得她难得露这面有意思。然后移开目光。

  对白：无。

  镜头运动：静止。

  避免：不嘲笑不大笑。视线方向朝画面右侧（蕾所在处）。


  [00:12-00:14.5] 双人中景 / 饭香唤回+淡出

  双人中景（保持甲左蕾右构图）。微风吹过。画外从厨房方向传来菜ノ叶元气大喊：「ふたりとも〜〜っ……！ご飯が炊けたよ〜〜っ！」。两人几乎同时转头朝向厨房所在的宿舍建筑方向（自然微差）。保持两秒，向厨房方向走去。

  镜头运动：静止。

  避免：转头不完全同步。不显示菜ノ叶。左右位置保持甲左蕾右。


  【Negative / 避免】

  - 闹别扭绝对不能画成生气或悲伤

  - 不要身份漂移（尤其蕾金发、角状发饰、灰色马甲）

  - 不要跳轴

  - 双人镜必须甲左蕾右

  '
