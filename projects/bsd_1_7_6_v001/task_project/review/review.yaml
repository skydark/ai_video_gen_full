- id: S002
  title: 厨房骚动（视线引导横摇）
  duration: 11.5
  type: closeup
  camera: 近景甲侧脸→顺视线横摇+微推 朝向厨房方向
  dialogue: あっ、ちょっと、レインさん、何をしているんですかっ！？ / え……これは切ってはいけませんでしたかっ！？ / いいんですけど、肉をみじん切りにしなくても……！って言うか、ちゃんと包丁使ってくださいよ〜〜っ！
    / す、すみませんっ……！このナイフに慣れ親しんでいるので、つい……
  intent: 承接花园宁静→用突然的尖叫打破；用甲的视线引导观众建立厨房方向的空间认知；四句画外对话层层递进喜剧张力（战斗刀→剁肉→道歉→习惯用刀）；镜头终点（建筑外墙）为蕾从那里走出做空间铺垫
  review: 甲侧头时机是否与第一声尖叫同步；横摇方向是否视觉上对应厨房方向；四句画外对话的节奏是否与镜头移动配合；观众能否理解声音来自镜头终点方向
  risk: 中。11.5秒长镜头，视线引导横摇+4句画外对话叠入，需镜头运动与声音时间轴精确同步。
