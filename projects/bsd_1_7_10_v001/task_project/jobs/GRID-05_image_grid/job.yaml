title: 沉默与雨前收束 - 多宫格分镜图
provider: runninghub_gpt_image
prompt: '生成一张 16:9 低饱和动画分镜草稿，多宫格清晰分隔，用来检查构图、轴线、走位、表情和情绪节奏。


  使用随任务提供的两张角色参考图和一张夜街参考图锁定外观与场景；不要在画面里写字。


  全局空间：甲始终偏画面左侧，蕾始终偏画面右侧；停步后正反打保持同一视线轴。


  雨前氛围：潮湿反光、低云、远处短暂雷光；不要下大雨。


  对白只用于口型/声音节奏，必须逐字保留。


  分格内容：


  1. 真心问不出口。双人中景，甲垂下目光，蕾沉默站在右侧。动作/表情：双人中景。甲在左侧等待回答，肩膀逐渐放松并垂下目光；蕾在右侧沉默。甲道歉后，两人之间保留明显空隙。 镜头：静止双人镜头，用停顿表现压力。 光线：低云压住街道，路灯短暂变暗，远处有很弱的雷光。
  对白：kou:"本当のことを話しては……くれないのか？" / kou:"……悪かった、レイン。聞き流してくれ……" 避免：不要让蕾开口回答，不要加入新台词。


  2. 雨要来了。蕾近景转远景拉远，两人继续并肩走入暗巷。动作/表情：蕾微微摇头，重新抬脸，露出克制的浅笑，说雨要来了。甲低声回应。两人重新并肩走向无人暗巷，背影渐小。 镜头：从蕾近景切到远景缓慢后拉，最后暗转。 光线：霓虹逐渐稀疏，低云压迫，远处冷白雷光短闪。
  对白：rei:"いえ……。急ぎましょう。雨が降りそうですから" / kou:"ああ……" 避免：不要下大雨，不要牵手或拥抱，不要新增角色。


  全局避免：不要身份漂移，不要跳轴，不要交换左右位置，不要画字幕、文字、水印或镜头编号。对白文本必须逐字保留原游戏语音文本，不得改写。'
