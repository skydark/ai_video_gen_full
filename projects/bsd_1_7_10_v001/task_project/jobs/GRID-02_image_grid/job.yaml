title: 死别阴影与请求 - 多宫格分镜图
provider: runninghub_gpt_image
prompt: '生成一张 16:9 低饱和动画分镜草稿，多宫格清晰分隔，用来检查构图、轴线、走位、表情和情绪节奏。


  使用随任务提供的两张角色参考图和一张夜街参考图锁定外观与场景；不要在画面里写字。


  全局空间：甲始终偏画面左侧，蕾始终偏画面右侧；停步后正反打保持同一视线轴。


  雨前氛围：潮湿反光、低云、远处短暂雷光；不要下大雨。


  对白只用于口型/声音节奏，必须逐字保留。


  分格内容：


  1. 死别阴影。蕾近景，路灯频闪掠过面庞，甲肩部在前景虚化。动作/表情：蕾近景。她视线从甲移到地面，声音转低；甲肩部只作为前景虚化轮廓。 镜头：极慢推近蕾的眼神，结尾停在她压住情绪的表情。 光线：路灯短暂闪烁，远处冷色霓虹变弱。 对白：rei:"……でも、そう言いたくなる気持ちもわかる気がします"
  / rei:"沢山、死に別れましたから……私も、甲さんも……" 避免：不要出现回忆人物，不要让蕾夸张哭泣。


  2. 如果我出事请离开。甲肩后过肩拍蕾，蕾停步正面看向甲。动作/表情：两人停步。以前景甲肩部过肩拍蕾；蕾在右中位置正面看向甲，站姿克制，像是在压住不安。 镜头：从并肩跟拍切到稳定过肩，轻微推近蕾。 光线：蕾半边脸在路灯下，半边落入阴影；远处霓虹轻闪。
  对白：rei:"……甲さん、ひとつ、お願いがあります" / kou:"なんだ……？" / rei:"私に何かあったら、この清城市を脱出し、事件から身を引いてください" 避免：不要跳轴，不要让蕾显得愤怒或命令式。


  全局避免：不要身份漂移，不要跳轴，不要交换左右位置，不要画字幕、文字、水印或镜头编号。对白文本必须逐字保留原游戏语音文本，不得改写。'
