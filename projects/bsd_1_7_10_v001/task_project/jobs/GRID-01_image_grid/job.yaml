title: 迎接与朋友话题 - 多宫格分镜图
provider: runninghub_gpt_image
prompt: '生成一张 16:9 低饱和动画分镜草稿，多宫格清晰分隔，用来检查构图、轴线、走位、表情和情绪节奏。


  使用随任务提供的两张角色参考图和一张夜街参考图锁定外观与场景；不要在画面里写字。


  全局空间：甲始终偏画面左侧，蕾始终偏画面右侧；停步后正反打保持同一视线轴。


  雨前氛围：潮湿反光、低云、远处短暂雷光；不要下大雨。


  对白只用于口型/声音节奏，必须逐字保留。


  分格内容：


  1. 夜道迎接。远景到双人中景，贫民街夜道，甲偏左走入，蕾从右侧路灯下迎上。动作/表情：夜道远景。甲从画面左侧进入，蕾在画面右侧路灯下等待；两人短暂对视后并肩向街道深处走。 镜头：缓慢推近，从环境远景到双人中景；保持甲左、蕾右。 光线：潮湿地面有霓虹反光，雨前低云，路灯轻微闪烁。
  对白：rei:"迎えに来ました、甲さん" / kou:"ああ、ご苦労さん" 避免：不要新增主要路人，不要交换左右位置，不要画字幕或文字。


  2. 朋友让脸色变亮。并肩跟拍中近景，蕾侧脸偏右，甲听她说话。动作/表情：并肩行走中近景。蕾在右侧微微转头看甲，语气柔和；甲在左侧听着，表情稍意外但不打断。 镜头：侧向跟拍，偶尔让路灯柱从前景掠过。 光线：昏黄路灯和冷色霓虹交替扫过两人脸部。
  对白：rei:"やっぱり、友達って重要ですね……" / rei:"最近、甲さんの顔色が明るくて、見ていると正直、ホッとします" 避免：不要做成轻松喜剧，不要加入亲密肢体接触。


  全局避免：不要身份漂移，不要跳轴，不要交换左右位置，不要画字幕、文字、水印或镜头编号。对白文本必须逐字保留原游戏语音文本，不得改写。'
