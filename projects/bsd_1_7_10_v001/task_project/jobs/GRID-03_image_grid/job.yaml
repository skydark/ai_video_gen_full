  使用随任务提供的两张角色参考图和一张夜街参考图锁定外观与场景；不要在画面里写字。


  全局空间：甲始终偏画面左侧，蕾始终偏画面右侧；停步后正反打保持同一视线轴。


  雨前氛围：潮湿反光、低云、远处短暂雷光；不要下大雨。


  对白只用于口型/声音节奏，必须逐字保留。


  分格内容：


  1. 约定与拒绝。蕾肩后过肩拍甲，甲低声但坚定拒绝。动作/表情：反打甲近景。蕾的肩部在前景右侧虚化；甲在左中位置先垂眼听完，然后抬眼直视蕾，低声坚定拒绝。 镜头：静止近景，甲说出拒绝时轻微推近。 光线：甲脸部有冷暖交错反光，地面反光轻微晃动。
  对白：rei:"万が一のことを話しているのです。……約束してくれますね、甲さん？" / kou:"ダメだね。そんな事、約束なんかできっこない" 避免：不要让甲吼叫或夸张挥手，不要跳轴。


  2. 没有我也没关系。蕾近景，表情闪过极细微痉挛后抹平。动作/表情：蕾近景。听到拒绝后，她脸上有极短的动摇，随后把表情压平；她避开甲视线半秒，又强迫自己看回来。 镜头：静止近景，轻微手持呼吸感。 光线：路灯闪过脸部，短暂暴露动摇后回到阴影。
  对白：rei:"そんな……どうして……。私が居なくても、もう甲さんは大丈夫なはずです" 避免：不要大哭，不要做恐怖表情，不要新增动作。


  全局避免：不要身份漂移，不要跳轴，不要交换左右位置，不要画字幕、文字、水印或镜头编号。对白文本必须逐字保留原游戏语音文本，不得改写。'
