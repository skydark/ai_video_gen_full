    角色锚点：


    - 门仓甲：一名年轻男性角色，拥有深棕色的短发，发型略显凌乱，刘海自然垂在额前。他有着蓝色的眼睛和白皙的皮肤，面部轮廓清秀。身穿一件黑色的长款连帽风衣（派克大衣），帽子边缘装饰有厚实的浅棕色毛领，风衣边缘有白色滚边线条，内衬为浅米色。内搭一件浅蓝色的圆领T恤。下身穿着深蓝色的宽松长裤，裤脚卷起露出白色边缘，搭配深蓝色的长袜或护腿。脚踩黑色系带高帮战斗靴。腰间系着棕色皮带，手上戴着黑色的露指手套。体型瘦削匀称，呈现出少年的体态。


    - 桐岛蕾：角色拥有一头金色的长直发，刘海细碎，头戴一顶黑色的贝雷帽，帽后系有黑色缎带。她有着蓝色的瞳孔和白皙的皮肤，面部表情丰富（包含喜、怒、哀、乐）。身穿一件黑色的长款军大衣（风衣），大衣下摆开叉，露出浅蓝色的内衬，袖口有皮带扣装饰。内搭白色双排扣马甲，系着深蓝色的领带。下身穿着黑色超短裙，大腿处绑有黑色的腿环。腿部穿着浅灰色的连裤袜，脚踩黑色系带高筒军靴。腰间系有棕色皮带。整体站姿挺拔，展现出军人的威严与干练。


