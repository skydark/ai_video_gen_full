name: 贫民窟街道
type: scene
ref_image: 现代篇_贫民窟_街道_夜晚.png

brief: |
  拥挤的近未来亚洲风格贫民窟街道，布满霓虹招牌与老旧建筑，远处耸立巨大未来地标，充满反乌托邦氛围。

detail: |
  这是一个近未来赛博朋克风格的室外街道场景。空间狭窄拥挤，两侧是密集的多层老旧混凝土建筑，底层为商铺和酒吧（如“Neon Drifter”），上层为住宅。建筑外立面挂满了密集的霓虹灯招牌，混合了中文、英文和日文，发出红、绿、蓝、黄等各色光芒。街道地面潮湿，反射着灯光，路边散落着垃圾桶、纸箱、空调外机和停放的旧式车辆。视线尽头耸立着一座巨大的、尖塔状的未来主义地标建筑，直插阴沉的云层。整体色调偏冷灰绿，点缀着温暖的店铺灯光和刺眼的霓虹色，营造出一种压抑、混乱且充满生活气息的“高科技低生活”氛围。

