  title: 如果我出事请离开
  duration: 12.0
  type: dialogue_ots
  camera: 甲肩后过肩拍蕾，蕾停步正面看向甲
  dialogue: ……甲さん、ひとつ、お願いがあります / なんだ……？ / 私に何かあったら、この清城市を脱出し、事件から身を引いてください
  intent: 核心请求出现，剧情从同行谈话转为关系危机。
  review: 蕾停步、甲注意力被拉住、请求严重性是否明确。
  risk: 高。OTS 和停步轴线需要多宫格确认。
