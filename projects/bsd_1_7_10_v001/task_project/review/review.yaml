dialogue_policy: 复用游戏语音素材；dialogue_timing.text 必须逐字保留原剧本文本，不得改写或合并成新台词。本版仅删除少量缓冲对白，保留的对白全部照抄原文。
dialogue_cuts:
- voice_id: v10001032
  text: なんだ、いきなり？
  reason: 删除轻微打岔，直接让蕾说明朋友话题，节奏更紧。
- voice_id: v10001033
  text: そんなに、俺の表情って変わっているのか？
  reason: 删除重复确认，保留蕾观察甲变亮的核心。
- voice_id: v10100765
  text: ええ……
  reason: 删除单字承接，不影响信息。
- voice_id: v10001038
  text: どうしたんだ、いきなり、そんな……
  reason: 删除重复惊讶，后续拒绝已能体现冲击。
- voice_id: v10100773
  text: アークは甲さんを保護してくれるでしょうし、アーヴァル・シティには、甲さんにとって大切な人が生きています
  reason: 删除解释性退路，避免一镜过长；保留‘没有我也没关系’和菜ノ叶支撑信息。
- voice_id: v10100775
  text: 私は別に……
  reason: 删除短促回避，直接进入恩情/仰慕句，保留蕾回避动作。
asset_gaps:
- 缺少雨前低云/远雷的专用参考；仅在镜头文字中描述为低云、远处短暂雷光、潮湿反光。
- 缺少菜ノ叶回忆画面资产；本版不生成回忆画面，只保留甲的原台词。
