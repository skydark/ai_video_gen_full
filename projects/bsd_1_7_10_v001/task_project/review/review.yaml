  camera: 蕾近景转远景拉远，两人继续并肩走入暗巷
  dialogue: いえ……。急ぎましょう。雨が降りそうですから / ああ……
  intent: 蕾退回冷静面具，用天气结束对话，章终以雷雨压迫收束。
  review: 冷静浅笑是否像面具；拉远和雷光是否有章终余韵。
