  prompt_preview: 双人中景。甲在左侧等待回答，肩膀逐渐放松并垂下目光；蕾在右侧沉默。甲道歉后，两人之间保留明显空隙。 / 静止双人镜头，用停顿表现压力。 / 低云压住街道，路灯短暂变暗，远处有很弱的雷光。
