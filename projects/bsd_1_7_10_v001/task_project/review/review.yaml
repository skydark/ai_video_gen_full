  duration: 10.0
  type: closeup
  camera: 蕾近景，表情闪过极细微痉挛后抹平
  dialogue: そんな……どうして……。私が居なくても、もう甲さんは大丈夫なはずです
  intent: 表现蕾真实受伤但试图合理化自己的退场。
  review: 细微动摇是否清楚；不要过度表演。
  risk: 高。微表情难稳定，建议先出多宫格。
  recommendation: 先做多宫格
  segment: 约定被拒绝
  video_task: 没有我也没关系
  prompt_preview: 蕾近景。听到拒绝后，她脸上有极短的动摇，随后把表情压平；她避开甲视线半秒，又强迫自己看回来。 / 静止近景，轻微手持呼吸感。 / 路灯闪过脸部，短暂暴露动摇后回到阴影。
  status: pending
  feedback: ''
  tags: []
  locked: false
- id: S007
  title: 你就是支撑
  duration: 13.0
  type: dialogue_two
  camera: 双人中近景转甲近景，甲抬头直视蕾
  dialogue: ……そういえば、菜ノ葉に、俺をよろしくとか言ったらしいな？ / ええ……。中尉には、心の支えになってくれる人が必要ですから / 今更、何を言うんだよ。今だって充分に、レインが支えになってくれてるさ
  intent: 保留菜ノ叶信息但不插回忆，让甲把关系核心说出口。
  review: 不用新增菜ノ叶资产仍能理解；甲的直视是否有冲击力。
  risk: 高。三句对白压在一个任务内，需检查节奏。
  recommendation: 先做多宫格
  segment: 你就是支撑
  video_task: 你就是支撑
  prompt_preview: 双人中近景。甲从沉默中抬头，提起菜ノ叶；蕾在右侧用平静理由回应；甲向前半步，直视蕾说出她就是支撑。 / 从双人中景缓慢推到甲偏左近景，结尾保留蕾右侧反应。 / 两人之间的湿地反光形成分隔线，路灯闪烁减弱。
  status: pending
  feedback: ''
  tags: []
  locked: false
- id: S008
  title: 只是恩与仰慕吗
  duration: 11.0
  type: closeup
  camera: 蕾近景到双人静止，蕾回避视线后沉默
  dialogue: 中尉に恩を感じておりますし、慕ってもいました。……けれど、それは、ただ…… / ただ……なんだって言うんだよ？まさかまた、部下だからとか任務だからとか、そんなことを言うんじゃないだろうな？
  intent: 用蕾说不出口的停顿替代解释，突出真心被面具挡住。
  review: 沉默是否有压力；画外甲追问是否能被理解。
  risk: 中。长近景需要表情细节支撑。
  recommendation: 先做多宫格
  segment: 你就是支撑
  video_task: 只是恩与仰慕吗
  prompt_preview: 蕾近景。她移开视线，试图把感情说成恩情和仰慕，却在最后停住；甲追问时画面仍留在蕾沉默的脸上。 / 极慢推近蕾眼睛，甲画外追问时不切走。 / 路灯断续掠过蕾的脸，眼中有霓虹碎光。
  status: pending
  feedback: ''
  tags: []
  locked: false
