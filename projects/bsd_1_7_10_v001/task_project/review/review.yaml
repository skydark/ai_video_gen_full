- id: S001
  title: 夜道迎接
  duration: 6.0
  type: establishing
  camera: 远景到双人中景，贫民街夜道，甲偏左走入，蕾从右侧路灯下迎上
  dialogue: 迎えに来ました、甲さん / ああ、ご苦労さん
  intent: 建立章终夜道空间和二人并肩关系。
  review: 夜街压迫感、两人左右位置、迎接动作是否清楚。
  risk: 中。夜景远景角色身份可能漂移。
  recommendation: 先做多宫格
  segment: 迎接与朋友话题
  video_task: 迎接与朋友话题
  prompt_preview: 夜道远景。甲从画面左侧进入，蕾在画面右侧路灯下等待；两人短暂对视后并肩向街道深处走。 / 缓慢推近，从环境远景到双人中景；保持甲左、蕾右。 / 潮湿地面有霓虹反光，雨前低云，路灯轻微闪烁。
  status: pending
  feedback: ''
  tags: []
  locked: false
- id: S002
  title: 朋友让脸色变亮
  duration: 9.0
  type: dialogue_two
  camera: 并肩跟拍中近景，蕾侧脸偏右，甲听她说话
  dialogue: やっぱり、友達って重要ですね…… / 最近、甲さんの顔色が明るくて、見ていると正直、ホッとします
  intent: 用蕾主动观察甲的变化，把话题从日常带向关系核心。
  review: 蕾是否有少量暖意；甲是否仍在听而不是抢戏。
  risk: 中。并肩行走口型和身份一致性较难。
  recommendation: 先做多宫格
  segment: 迎接与朋友话题
  video_task: 迎接与朋友话题
  prompt_preview: 并肩行走中近景。蕾在右侧微微转头看甲，语气柔和；甲在左侧听着，表情稍意外但不打断。 / 侧向跟拍，偶尔让路灯柱从前景掠过。 / 昏黄路灯和冷色霓虹交替扫过两人脸部。
  status: pending
  feedback: ''
  tags: []
  locked: false
