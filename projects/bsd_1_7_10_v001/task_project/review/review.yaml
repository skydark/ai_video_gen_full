  duration: 12.0
  type: dialogue_ots
  camera: 蕾肩后过肩拍甲，甲低声但坚定拒绝
  dialogue: 万が一のことを話しているのです。……約束してくれますね、甲さん？ / ダメだね。そんな事、約束なんかできっこない
  intent: 让甲明确拒绝蕾安排他的退路，确立两人价值冲突。
  review: 甲的坚定是否可读；与上一镜轴线是否连续。
  risk: 高。正反打身份、左右关系、口型需确认。
  recommendation: 先做多宫格
  segment: 约定被拒绝
  video_task: 约定与拒绝
  prompt_preview: 反打甲近景。蕾的肩部在前景右侧虚化；甲在左中位置先垂眼听完，然后抬眼直视蕾，低声坚定拒绝。 / 静止近景，甲说出拒绝时轻微推近。 / 甲脸部有冷暖交错反光，地面反光轻微晃动。
  status: pending
  feedback: ''
  tags: []
