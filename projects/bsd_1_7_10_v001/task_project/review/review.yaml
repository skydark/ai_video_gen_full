  duration: 10.0
  type: dialogue_two
  camera: 双人中景，甲垂下目光，蕾沉默站在右侧
  dialogue: 本当のことを話しては……くれないのか？ / ……悪かった、レイン。聞き流してくれ……
  intent: 让甲意识到无法逼出真心，情绪下沉。
  review: 蕾沉默、甲放弃追问是否明确；停顿是否足够。
  risk: 中。静止镜头需避免空。
  recommendation: 先做多宫格
