brief: |
  室内酒吧，拥有L型吧台和散座区。场景以深红、紫色和蓝色的霓虹灯光为主调，融合了装饰艺术风格与轻微的科幻元素。

detail: |
  室内酒吧场景，采用多角度展示。空间包含一个长L型木质吧台，后方设有摆满各式酒瓶的层架和发光的冷藏柜。大厅铺设深色方格地砖，散布着若干圆形木桌和金属高脚凳。墙壁装饰有深红褐色的木质护墙板和拱形门洞，门洞内透出强烈的紫色霓虹光。立柱上装有垂直的蓝色发光灯管，桌上有独特的圆柱形发光装置和酒瓶。整体光线昏暗，色彩以深红、紫罗兰和冷蓝为主，营造出一种静谧、高档且略带赛博朋克感的夜晚氛围。

