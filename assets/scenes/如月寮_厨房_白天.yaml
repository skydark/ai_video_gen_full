brief: |
  明亮温馨的日式狭长型厨房，拥有棋盘格地板和木质家具，自然光从尽头窗户洒入，充满日常生活气息。

detail: |
  室内场景，狭长布局的日式家庭厨房。地面铺设棕色与米色相间的棋盘格瓷砖。左侧为长条形不锈钢流理台，设有双槽水槽和双眼燃气灶，灶上放着绿色水壶，台面上有切菜板和刀具。右侧靠墙摆放着深木色玻璃门餐具柜和米白色双开门冰箱，冰箱顶部放置微波炉，门上贴有便签。尽头有一扇木门和一扇大窗户，窗外可见绿色的菜园植被。墙壁为米色，挂有换气扇、厨具和置物架。光线明亮柔和，呈现温暖的居家氛围。

