# scene asset: 日式传统和室（客厅/活动室）
id: 如月寮_客厅_白天
name: 如月寮 客厅
type: scene
ref_image: 如月寮_客厅_白天.png

brief: |
  铺满榻榻米的日式传统房间，阳光透过右侧窗户洒入，中央摆放着矮桌与红色坐垫，充满怀旧的动漫生活气息。

detail: |
  这是一个典型的日式和室场景，地面铺设有黄绿色的榻榻米，带有深绿色边缘。房间中央放置着一张深棕色的低矮木制方桌，周围随意摆放着四个红色的方形坐垫。房间右侧是带有木格栅的大窗户，挂着白色的半透明窗帘，明亮的自然光从此处射入，照亮了整个空间。左侧设有带有蓝色横条纹的白色推拉门（襖），通向另一个可见木质家具的房间。房间角落放置着老式的CRT电视机和电视柜，墙上挂着日历、两个写有“必勝”字样的红色灯笼以及三角形锦旗，天花板上有方形吸顶灯和空调，整体呈现出一种90年代日本家庭的温馨与怀旧感。

tags: [日式和室, 榻榻米, 矮桌, 红色坐垫, 老式电视, 动漫风格, 室内, 白天, 怀旧, 推拉门]
