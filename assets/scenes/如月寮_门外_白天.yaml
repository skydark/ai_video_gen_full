# scene asset: 如月寮
id: 如月寮_门外_白天
name: 如月寮（日式学生宿舍）
type: scene
ref_image: 如月寮_门外_白天.png

brief: |
  位于郊区的日式两层木质宿舍楼“如月寮”，配有自行车棚和绿植庭院，阳光明媚的夏日动漫风格场景。

detail: |
  这是一个明亮的室外场景，主体是一座两层高的传统日式木造建筑，名为“如月寮”。建筑拥有深棕色的垂直木板外墙和绿色的瓦片屋顶，结构古朴。建筑左侧设有一个开放式的木质自行车棚，下方停放着几辆黑色的城市自行车。正门入口处两侧摆放着砖砌的长方形花坛，里面种满了盛开的白色花卉。建筑周围环绕着木制围栏，背景是连绵的青山和茂密的树林。天空呈现鲜艳的湛蓝色，漂浮着洁白的积云，阳光强烈，在地面投下清晰的阴影，整体呈现出高饱和度、清新宁静的夏日午后氛围。

