id: hotel_room_morning
name: 爱情旅馆房间（清晨）
name_jp: ホテルの部屋（朝）
type: scene
source: Baldr Sky

brief: |
  白天光线充足的酒店标准间，阳光从右侧窗户射入照亮床铺和地毯。包含睡眠区、休息区和玄关，氛围安静略带复古感。

detail: |
  室内场景，酒店客房。房间左侧为入口区域，设有深棕色木门、大型木质衣柜和金属挂衣架。
  房间中央放置一张双人床，铺着棕橙色格纹床罩，床头两侧有床头柜和台灯，墙上挂有空调。
  右侧靠窗区域摆放紫色复古三人沙发和玻璃茶几，窗户挂粉紫色窗帘。
  强烈自然光从窗外射入，形成明显光束照在床上和深蓝色几何图案地毯上。
  前景有木质地柜，上置老式黑色CRT电视机。墙壁灰白色，天花板有嵌入式筒灯。
  整体呈现动漫概念设计视觉风格，清晨柔和暖光氛围。

