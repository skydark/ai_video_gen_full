# scene asset: 乡村木屋与菜园（日式乡间住宅）
id: 如月寮_后院_白天
name: 如月寮后院
type: scene
ref_image: 如月寮_后院_白天.png

brief: |
  这是一栋位于郊区的日式两层木质住宅的后院，周围环绕着木栅栏和生机勃勃的菜园，背景是晴朗的蓝天和远山，充满宁静的田园氛围。

detail: |
  这是一个阳光明媚的乡村户外场景，主体是一栋两层高的深棕色木质传统住宅，屋顶覆盖着青绿色的瓦片，设有多个玻璃窗。房屋被深褐色的木栅栏环绕，院内开垦了整齐的菜园，种植着卷心菜、大葱等绿色蔬菜以及紫色和黄色的花卉。房屋周围点缀着茂盛的绿树，背景是连绵起伏的青山和飘着朵朵白云的湛蓝天空。整体画面色彩鲜艳，光影清晰，呈现出宁静祥和的田园生活氛围，具有典型的日本动画背景美术风格。

