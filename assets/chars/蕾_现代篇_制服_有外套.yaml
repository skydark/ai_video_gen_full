name: 桐岛蕾
type: character
ref_image: 蕾_现代篇_制服_有外套.png

brief: |
  一位金发蓝眼的年轻女性，身穿黑色苏式军大衣、贝雷帽和军靴，气质干练冷艳，具有明显的军人风格。

detail: |
  角色拥有一头金色的长直发，刘海细碎，头戴一顶黑色的贝雷帽，帽后系有黑色缎带。她有着蓝色的瞳孔和白皙的皮肤，面部表情丰富（包含喜、怒、哀、乐）。身穿一件黑色的长款军大衣（风衣），大衣下摆开叉，露出浅蓝色的内衬，袖口有皮带扣装饰。内搭白色双排扣马甲，系着深蓝色的领带。下身穿着黑色超短裙，大腿处绑有黑色的腿环。腿部穿着浅灰色的连裤袜，脚踩黑色系带高筒军靴。腰间系有棕色皮带。整体站姿挺拔，展现出军人的威严与干练。

