name: 须藤雅
type: character
ref_image: 雅_现代篇_制服_有外套.png

brief: |
  一位年轻男性，留着深棕色短发，身穿米色长款风衣搭配白衬衫和深蓝色领带，气质干练且略带随性，看似风流倜傥实则诚实可靠的警察角色。

detail: |
  一位年轻男性角色，拥有深棕色的短发，发型略显凌乱但向后梳理，露出额头。瞳孔呈深蓝色，肤色白皙，面部轮廓柔和。身穿一件米色（卡其色）的长款风衣，风衣敞开，露出里面的白色长袖衬衫。系着一条深蓝色的领带，领带结打得较松，显得随意。下身穿着深灰色的西装长裤，系着棕色皮带。脚穿深棕色皮鞋。脖子上戴着一条细银色项链。体型修长挺拔，常呈现双手插兜的站姿，表情丰富多变，从自信微笑到惊讶困惑皆有。

tags: [米色风衣, 白衬衫, 深蓝色领带, 深灰色西裤, 棕色皮鞋, 皮带, 项链]
